<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienvenida · LARŌ Organic Skin Rituals</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="narciso.laro.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --garnet: #540B0E;
    --cream:  #F9F7F6;
    --pink:   #E9D9D6;
    --dark:   #2A1A1B;
    --text:   #3D2B2C;
    --muted:  #8A7070;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--cream);
    color: var(--text);
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  header { text-align: center; padding: 48px 24px 0; }
  header img { height: 140px; width: auto; mix-blend-mode: multiply; }

  .divider { width: 1px; height: 40px; background: var(--garnet); margin: 32px auto; }

  .hero { text-align: center; padding: 0 24px; max-width: 620px; margin: 0 auto; }
  .page-label {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.35em;
    text-transform: uppercase; color: var(--garnet);
    margin-bottom: 16px; display: block;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 5vw, 2.8rem);
    font-weight: 300; line-height: 1.25; color: var(--dark);
    margin-bottom: 18px;
  }
  h1 em { font-style: italic; color: var(--garnet); }
  .hero-sub { font-size: 0.95rem; line-height: 1.8; color: var(--muted); max-width: 480px; margin: 0 auto; }

  .schedule-wrap {
    max-width: 720px;
    margin: 48px auto 0;
    padding: 0 16px 60px;
  }
  iframe {
    width: 100%;
    height: 850px;
    border: 1px solid var(--pink);
    background: white;
  }

  footer {
    background: var(--dark); color: rgba(249,247,246,0.4);
    text-align: center; padding: 32px 24px;
    font-size: 0.72rem; letter-spacing: 0.15em;
  }
</style>
</head>
<body>

<header>
  <img src="narciso.laro.png" alt="LARŌ Organic Skin Rituals">
</header>

<div class="hero">
  <span class="page-label">Asesoría 1:1 · Un regalo para ti</span>
  <h1>Gracias por estar aquí.<br><em>Vamos a mimar tu piel.</em></h1>
  <p class="hero-sub">Elige el día y la hora que mejor te vengan. Al reservar, verás el código de descuento ya aplicado — recuerda completar el test de piel y el consentimiento antes de nuestra cita.</p>
</div>

<div class="divider"></div>

<div class="schedule-wrap">
  <iframe src="https://app.acuityscheduling.com/schedule.php?owner=40227513" frameborder="0"></iframe>
</div>

<footer>LARŌ · Organic Skin Rituals</footer>

</body>
</html>
