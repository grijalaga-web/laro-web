<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fechas · LARŌ Organic Skin Rituals</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="laro-flower.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --garnet: #540B0E;
    --cream: #F9F7F6;
    --pink: #E9D9D6;
    --dark: #2A1A1B;
    --text: #3D2B2C;
    --muted: #8A7070;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--cream);
    color: var(--text);
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    text-align: center;
    padding: 48px 24px 0;
  }
  header a { display: inline-block; }
  header img {
    height: 160px; width: auto;
    mix-blend-mode: multiply;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 64px 24px 80px;
  }
  .overline {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.35em;
    text-transform: uppercase; color: var(--garnet);
    display: block; margin-bottom: 32px;
  }
  .divider {
    width: 1px; height: 48px;
    background: rgba(84,11,14,0.3);
    margin: 0 auto 40px;
  }
  .status {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 300;
    font-style: italic;
    color: var(--muted);
    margin-bottom: 40px;
  }
  .back-link {
    display: inline-block;
    font-size: 0.72rem; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--garnet); text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
  }
  .back-link:hover { border-bottom-color: var(--garnet); }
  footer {
    background: var(--dark); color: rgba(249,247,246,0.4);
    text-align: center; padding: 32px 24px;
    font-size: 0.72rem; letter-spacing: 0.15em;
  }
  footer span { color: rgba(233,217,214,0.6); }
  footer a { color: rgba(249,247,246,0.4); text-decoration: none; }
  footer a:hover { color: var(--pink); }
</style>
</head>
<body>

<header>
  <a href="/">
    <img src="narciso.laro.png" alt="LARŌ Organic Skin Rituals">
  </a>
</header>

<main>
  <span class="overline">Talleres presenciales · Fechas</span>
  <div class="divider"></div>
  <p class="status">Sin fechas por el momento.</p>
  <a href="/" class="back-link">← Volver a LARŌ</a>
</main>

<footer>
  <p><a href="/">LARŌ · Organic Skin Rituals</a> · <span>Tu piel, tu ritual.</span></p>
</footer>

</body>
</html>
